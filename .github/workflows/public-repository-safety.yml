name: Public repository safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-and-private-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked private configuration and exports
        run: |
          python3 - <<'PYTHON'
          import pathlib, re, subprocess
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          blocked = []
          for name in filter(None, names):
              base = pathlib.PurePosixPath(name).name.lower()
              example = base in ('.env.example', '.dev.vars.example') or (base.startswith('.env.') and base.endswith('.example'))
              private_dir = re.search(r'(^|/)(\.aws|\.ssh|\.firebase|\.wrangler|\.oil-ui|private|private-data|backups|exports|uploads|artifacts|QA)/', name, re.I)
              private_name = re.search(r'^(?:\.env(?:\..*)?|\.dev\.vars(?:\..*)?|\.netrc|\.pypirc|id_rsa|id_ed25519|key\.properties|application_default_credentials\.json)$', base)
              private_json = base.endswith('.json') and any(part in base for part in ('service-account', 'service_account', 'firebase-adminsdk', 'credential'))
              private_file = re.search(r'\.(?:local\.json|pem|key|p12|pfx|jks|keystore|log|sql|dump|sqlite3?|db|zip|tar|tar\.gz|7z|xlsx|xls)$', base)
              private_csv = base.endswith('.csv') and any(part in base for part in ('student', 'attendance', 'payment'))
              if not example and (private_dir or private_name or private_json or private_file or private_csv):
                  blocked.append(name)
          if blocked:
              print('Private files must not be tracked:\n' + '\n'.join(blocked))
              raise SystemExit(1)
          print('Tracked private-file check passed.')
          PYTHON
      - name: Install checksum-pinned Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/mgm-gitleaks"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/mgm-gitleaks/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/mgm-gitleaks/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/mgm-gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/mgm-gitleaks" gitleaks
      - name: Scan tracked files and newly introduced commits
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          scan_dir="$(mktemp -d "$RUNNER_TEMP/mgm-source.XXXXXX")"
          trap 'rm -rf "$scan_dir"' EXIT
          git archive HEAD | tar -xf - -C "$scan_dir"
          "$RUNNER_TEMP/mgm-gitleaks/gitleaks" dir "$scan_dir" --config .gitleaks.toml --redact=100 --no-banner --ignore-gitleaks-allow
          if [[ "$SCAN_BASE" =~ ^[0-9a-f]{40}$ && "$SCAN_BASE" != 0000000000000000000000000000000000000000 ]]; then
            "$RUNNER_TEMP/mgm-gitleaks/gitleaks" git . --config .gitleaks.toml --log-opts="$SCAN_BASE..HEAD" --redact=100 --no-banner --ignore-gitleaks-allow
          fi
